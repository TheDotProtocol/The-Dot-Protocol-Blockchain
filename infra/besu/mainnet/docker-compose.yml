# Dot Protocol Mainnet — 7 QBFT validators (nodes 1-2 are master validators)
# Prerequisites: run `npm run chain:generate` first
# Start: npm run chain:mainnet:up

x-besu: &besu-defaults
  image: hyperledger/besu:25.1.0
  restart: unless-stopped
  logging:
    driver: json-file
    options:
      max-size: "50m"
      max-file: "5"

services:
  validator1:
    <<: *besu-defaults
    container_name: mainnet-validator1
    hostname: validator1
    networks:
      mainnet:
        ipv4_address: 172.29.0.11
    ports:
      - "9545:8545"
      - "9546:8546"
      - "30403:30303"
    volumes:
      - ./genesis.json:/config/genesis.json:ro
      - ./networkFiles/static-nodes.json:/config/static-nodes.json:ro
      - ./networkFiles/keys/node1:/keys:ro
      - mainnet-v1-data:/var/lib/besu
    command: >
      --data-path=/var/lib/besu
      --genesis-file=/config/genesis.json
      --static-nodes-file=/config/static-nodes.json
      --node-private-key-file=/keys/key
      --rpc-http-enabled
      --rpc-http-api=ETH,NET,WEB3,QBFT,ADMIN,TXPOOL
      --rpc-http-cors-origins=https://hexchange.YOUR_DOMAIN.com,https://YOUR_DOMAIN.com,https://www.YOUR_DOMAIN.com,http://localhost:3000,http://localhost:3001,http://localhost:3002,http://localhost:3003,http://localhost:3005
      --rpc-http-host=0.0.0.0
      --rpc-http-port=8545
      --rpc-ws-enabled
      --rpc-ws-host=0.0.0.0
      --rpc-ws-port=8546
      --host-allowlist=*
      --p2p-port=30303
      --p2p-host=172.29.0.11
      --min-gas-price=0
      --sync-mode=FULL

  validator2:
    <<: *besu-defaults
    container_name: mainnet-validator2
    hostname: validator2
