version: "3.8"

x-node-defaults: &node-defaults
  image: hyperledger/besu:24.12.0
  restart: unless-stopped
  networks:
    besu-net:
      ipv4_address: ${NODE_IP}

services:
  # ─── Bootnode ──────────────────────────────────────────────────
  bootnode:
    <<: *node-defaults
    container_name: tdp-bootnode
    environment:
      - NODE_IP=172.20.0.10
    ports:
      - "30303:30303"
      - "30303:30303/udp"
    volumes:
      - ./mainnet/genesis.json:/opt/besu/genesis.json
      - ./mainnet/bootnode-key:/opt/besu/bootnode-key
    command: >
      --data-path=/opt/besu/data
      --genesis-file=/opt/besu/genesis.json
      --node-private-key-file=/opt/besu/bootnode-key
      --rpc-http-enabled=true
      --rpc-http-host=0.0.0.0
      --rpc-http-port=8545
      --rpc-http-cors-origins=https://hexchange.YOUR_DOMAIN.com,https://YOUR_DOMAIN.com,https://www.YOUR_DOMAIN.com,http://localhost:3000,http://localhost:3001,http://localhost:3002,http://localhost:3003,http://localhost:3005
      --rpc-http-api=ETH,NET,WEB3,QBFT,TXPOOL,DEBUG
      --p2p-port=30303
      --logging=INFO
      --host-allowlist=*

  # ─── Validators 1–7 ────────────────────────────────────────────
  validator-1:
    <<: *node-defaults
    container_name: tdp-validator-1
    environment:
      - NODE_IP=172.20.0.11
    depends_on:
      - bootnode
    ports:
      - "8545:8545"
    volumes:
      - ./mainnet/genesis.json:/opt/besu/genesis.json
      - ./mainnet/validator-1-key:/opt/besu/node-key
      - ./mainnet/networkFiles/static-nodes.json:/opt/besu/static-nodes.json
    command: >
      --data-path=/opt/besu/data
      --genesis-file=/opt/besu/genesis.json
      --node-private-key-file=/opt/besu/node-key
      --bootnodes=enode://${BOOTNODE_ENODE}@172.20.0.10:30303
      --rpc-http-enabled=true
      --rpc-http-host=0.0.0.0
      --rpc-http-port=8545
      --rpc-http-cors-origins=https://hexchange.YOUR_DOMAIN.com,https://YOUR_DOMAIN.com,https://www.YOUR_DOMAIN.com,http://localhost:3000,http://localhost:3001,http://localhost:3002,http://localhost:3003,http://localhost:3005
      --rpc-http-api=ETH,NET,WEB3,QBFT,TXPOOL,DEBUG
      --p2p-port=30303
      --logging=INFO
      --host-allowlist=*

  validator-2:
    <<: *node-defaults
    container_name: tdp-validator-2
    environment:
      - NODE_IP=172.20.0.12
    depends_on:
      - bootnode
    volumes:
      - ./mainnet/genesis.json:/opt/besu/genesis.json
      - ./mainnet/validator-2-key:/opt/besu/node-key
    command: >
      --data-path=/opt/besu/data
      --genesis-file=/opt/besu/genesis.json
      --node-private-key-file=/opt/besu/node-key
      --bootnodes=enode://${BOOTNODE_ENODE}@172.20.0.10:30303
      --p2p-port=30303
      --logging=INFO

  validator-3:
    <<: *node-defaults
    container_name: tdp-validator-3
